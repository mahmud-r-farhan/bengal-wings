# ==============================================================================
# 🦅 BENGAL WINGS CI — GCS core gate (stdlib Python only, runs in <30 s)
# ==============================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  gcs-tests:
    name: Unit tests + GCS boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all Python sources
        run: python3 -m compileall -q gcs tests

      - name: Dashboard assets present
        run: |
          test -f gcs/web/index.html
          test -f gcs/web/style.css
          test -f gcs/web/app.js
          node --check gcs/web/app.js

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Boot GCS + HTTP/WS smoke test
        run: |
          python3 -m gcs --port 8090 & PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8090/api/status
          curl -fsS http://127.0.0.1:8090/api/telemetry | python3 -m json.tool > /dev/null
          curl -fsS http://127.0.0.1:8090/ | grep -q "BENGAL WINGS"
          curl -fsS -X POST http://127.0.0.1:8090/api/command \
               -H 'Content-Type: application/json' -d '{"cmd":"hold"}'
          kill $PID

      - name: Path-traversal guard
        run: |
          python3 -m gcs --port 8091 & PID=$!
          sleep 2
          code=$(curl -s -o /dev/null --path-as-is -w "%{http_code}" http://127.0.0.1:8091/../README.md)
          test "$code" = "404"
          kill $PID
